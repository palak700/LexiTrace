services:
  backend:
    build:
      context: ./backend
    environment:
      - LEXITRACE_MODE=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    profiles: ["optional-db"]
    environment:
      POSTGRES_DB: lexitrace
      POSTGRES_USER: lexitrace
      POSTGRES_PASSWORD: lexitrace_dev
    ports:
      - "5432:5432"
